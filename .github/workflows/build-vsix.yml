name: Build VSIX

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Select packaged version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          asset="repository-manager-$version.vsix"
          test -f "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-manager-vsix
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

  upload-release:
    if: github.event_name == 'release'
    needs: build-vsix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download built VSIX
        uses: actions/download-artifact@v4
        with:
          name: repository-manager-vsix

      - name: Verify version and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

          asset="repository-manager-$version.vsix"
          if [ ! -f "$asset" ]; then
            echo "::error::Built VSIX $asset is missing"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "$asset" --clobber
