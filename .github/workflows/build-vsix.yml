name: Build VSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload a VSIX to (leave blank for CI only)
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: npm test

      - name: Verify VSIX packaging
        run: npm run package

  upload-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      # Earlier release tags have a test that expects a named local branch.
      - name: Provide local branch for tagged builds
        run: git switch -c release-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile, lint, and test
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload matching VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          asset="repository-manager-$version.vsix"
          if [ ! -f "$asset" ]; then
            echo "::error::Built VSIX $asset is missing"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
